<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="倒班查询">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23302b63'/><text x='50' y='65' text-anchor='middle' font-size='50'>⏱</text></svg>">
  <title>倒班查询 - 白夜休休</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      margin-top: 16px;
    }

    h1 {
      color: #1a1a2e;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #999;
      text-align: center;
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* 今日班次卡片 */
    .today-card {
      background: #f8f9fb;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid #eee;
    }

    .today-label {
      color: #999;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .today-date {
      color: #666;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .today-shift {
      display: inline-block;
      font-size: 44px;
      font-weight: 900;
      padding: 10px 36px;
      border-radius: 14px;
      letter-spacing: 4px;
    }

    .shift-day { background: #fff3dc; color: #d4850a; }
    .shift-night { background: #ede4f7; color: #5b2d8e; }
    .shift-off { background: #daf5e8; color: #1a7a4c; }

    /* 日期查询 */
    .query-section {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .query-section input[type="date"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .query-section input[type="date"]:focus {
      border-color: #999;
    }

    .query-section button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #1a1a2e;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .query-section button:hover {
      background: #333;
    }

    .query-result {
      color: #333;
      text-align: center;
      font-size: 15px;
      margin-bottom: 20px;
      min-height: 22px;
    }

    .query-result .shift-badge {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      margin: 0 4px;
    }

    /* 月历 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .calendar-header .month-label {
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 600;
    }

    .calendar-header button {
      background: #f0f0f0;
      border: none;
      color: #555;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .calendar-header button:hover {
      background: #ddd;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 6px;
    }

    .weekdays span {
      color: #bbb;
      font-size: 11px;
      padding: 4px 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .calendar-grid .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
      gap: 0;
      padding: 2px;
    }

    .day-num {
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .day-shift {
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
      margin-top: 1px;
    }

    .calendar-grid .day:hover {
      transform: scale(1.06);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .calendar-grid .day.empty {
      cursor: default;
    }

    .calendar-grid .day.empty:hover {
      transform: none;
      box-shadow: none;
    }

    .day-shift-day {
      background: #fff8ec;
      color: #c47a0a;
    }

    .day-shift-night {
      background: #f6f0fc;
      color: #6b3fa0;
    }

    .day-shift-off {
      background: #eafaf2;
      color: #1e8c56;
    }

    .day.today {
      border: 2px solid #1a1a2e;
    }

    .day.leave {
      box-shadow: inset 0 0 0 2.5px #e74c3c;
    }

    .day.leave::after {
      content: '假';
      position: absolute;
      top: -3px;
      right: -3px;
      background: #e74c3c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 2;
    }

    .query-result .leave-btn {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 12px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      vertical-align: middle;
    }

    .leave-btn.mark {
      background: #ffe0e0;
      color: #c0392b;
    }

    .leave-btn.unmark {
      background: #e74c3c;
      color: #fff;
    }

    .leave-btn:hover {
      opacity: 0.85;
    }

    /* 图例 */
    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #aaa;
      font-size: 11px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }

    .legend-dot.day { background: #f0c040; }
    .legend-dot.night { background: #9b6fc0; }
    .legend-dot.off { background: #4cbf80; }
    .legend-dot.leave { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏱ 倒班查询</h1>
    <p class="subtitle">白 → 夜 → 休 → 休</p>

    <!-- 今日卡片 -->
    <div class="today-card">
      <div class="today-label">今日班次</div>
      <div class="today-date" id="todayDate"></div>
      <div class="today-shift" id="todayShift"></div>
    </div>

    <!-- 日期查询 -->
    <div class="query-section">
      <input type="date" id="queryDate">
      <button onclick="queryDate()">查询</button>
    </div>
    <div class="query-result" id="queryResult"></div>

    <!-- 月历 -->
    <div class="calendar-header">
      <button onclick="prevMonth()">◀</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="nextMonth()">▶</button>
    </div>
    <div class="weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot day"></span> 白班</div>
      <div class="legend-item"><span class="legend-dot night"></span> 夜班</div>
      <div class="legend-item"><span class="legend-dot off"></span> 休息</div>
      <div class="legend-item"><span class="legend-dot leave"></span> 请假</div>
    </div>
  </div>

  <script>
    // ========== 核心逻辑 ==========
    // 锚点：2026-08-05 是白班（索引 0）
    const ANCHOR_DATE = new Date(2026, 7, 5); // 月份从0开始，7=8月
    const SHIFT_CYCLE = ['白', '夜', '休', '休'];
    const SHIFT_CLASS = ['shift-day', 'shift-night', 'shift-off', 'shift-off'];
    const DAY_SHIFT_CLASS = ['day-shift-day', 'day-shift-night', 'day-shift-off', 'day-shift-off'];

    // ========== 请假数据 (localStorage) ==========
    function getLeaveDates() {
      try {
        return JSON.parse(localStorage.getItem('shift-leave-dates') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLeaveDates(dates) {
      localStorage.setItem('shift-leave-dates', JSON.stringify(dates));
    }

    function isLeave(dateStr) {
      return getLeaveDates().includes(dateStr);
    }

    function toggleLeave(dateStr) {
      const dates = getLeaveDates();
      const idx = dates.indexOf(dateStr);
      if (idx >= 0) {
        dates.splice(idx, 1);
      } else {
        dates.push(dateStr);
      }
      saveLeaveDates(dates);
      // 刷新当前月历
      renderCalendar(calendarYear, calendarMonth);
      // 如果当前查询结果刚好是这个日期，刷新显示
      if (selectedDateStr === dateStr) {
        queryDate();
      }
    }

    function getShift(date) {
      const diffDays = Math.floor((date - ANCHOR_DATE) / (1000 * 60 * 60 * 24));
      // 处理负数的模运算
      const idx = ((diffDays % 4) + 4) % 4;
      return { name: SHIFT_CYCLE[idx], class: SHIFT_CLASS[idx], dayClass: DAY_SHIFT_CLASS[idx] };
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const w = weekdays[date.getDay()];
      return `${y}年${m}月${d}日 星期${w}`;
    }

    // ========== 今日卡片 ==========
    function renderToday() {
      const today = new Date();
      document.getElementById('todayDate').textContent = formatDate(today);
      const shift = getShift(today);
      const el = document.getElementById('todayShift');
      el.textContent = shift.name;
      el.className = 'today-shift ' + shift.class;
      // 设置查询日期默认值
      document.getElementById('queryDate').value = today.toISOString().split('T')[0];
    }

    // ========== 当前选中日期 ==========
    let selectedDateStr = null;

    // ========== 日期查询 ==========
    function queryDate() {
      const input = document.getElementById('queryDate').value;
      if (!input) return;
      const date = new Date(input + 'T00:00:00');
      const shift = getShift(date);
      const ds = input;
      selectedDateStr = ds;
      const leave = isLeave(ds);
      const leaveBtn = leave
        ? `<button class="leave-btn unmark" onclick="event.stopPropagation(); toggleLeave('${ds}')">取消请假</button>`
        : `<button class="leave-btn mark" onclick="event.stopPropagation(); toggleLeave('${ds}')">标记请假</button>`;
      document.getElementById('queryResult').innerHTML =
        `${formatDate(date)} — <span class="shift-badge ${shift.class}">${shift.name}</span>${leaveBtn}`;
    }

    // ========== 月历 ==========
    let calendarYear, calendarMonth;

    function renderCalendar(year, month) {
      calendarYear = year;
      calendarMonth = month;

      document.getElementById('monthLabel').textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDayOfWeek = firstDay.getDay(); // 0=周日
      const daysInMonth = lastDay.getDate();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let html = '';
      // 填充空白格
      for (let i = 0; i < startDayOfWeek; i++) {
        html += '<div class="day empty"></div>';
      }
      // 日期格
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const shift = getShift(date);
        const isToday = date.getTime() === today.getTime();
        const todayClass = isToday ? ' today' : '';
        const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const leaveClass = isLeave(ds) ? ' leave' : '';
        html += `<div class="day ${shift.dayClass}${todayClass}${leaveClass}" data-date="${ds}" data-shift="${shift.name}" onclick="selectDate('${ds}')" oncontextmenu="handleDayRightClick(event, '${ds}')"><span class="day-num">${d}</span><span class="day-shift">${shift.name}</span></div>`;
      }

      document.getElementById('calendarGrid').innerHTML = html;
    }

    function prevMonth() {
      if (calendarMonth === 0) {
        renderCalendar(calendarYear - 1, 11);
      } else {
        renderCalendar(calendarYear, calendarMonth - 1);
      }
    }

    function nextMonth() {
      if (calendarMonth === 11) {
        renderCalendar(calendarYear + 1, 0);
      } else {
        renderCalendar(calendarYear, calendarMonth + 1);
      }
    }

    function selectDate(dateStr) {
      document.getElementById('queryDate').value = dateStr;
      queryDate();
    }

    // 右键 → 标记请假 (PC)
    function handleDayRightClick(event, dateStr) {
      event.preventDefault();
      toggleLeave(dateStr);
      // 如果当前查询结果刚好是这个日期，刷新查询结果显示新状态
      if (selectedDateStr === dateStr) {
        queryDate();
      }
    }

    // ========== 初始化 ==========
    const now = new Date();
    renderToday();
    renderCalendar(now.getFullYear(), now.getMonth());

    // 回车查询
    document.getElementById('queryDate').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') queryDate();
    });
  </script>
</body>
</html>
